<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نتيجة أحمد 🎓</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;touch-action:pan-y}

/* Stars */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 2s infinite alternate}
@keyframes twinkle{from{opacity:.2;transform:scale(1)}to{opacity:1;transform:scale(1.5)}}

/* Card */
#main-card{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:2px solid rgba(255,255,255,.2);border-radius:24px;padding:clamp(20px,5vw,40px);max-width:560px;width:100%;text-align:center;position:relative;z-index:10;box-shadow:0 20px 60px rgba(0,0,0,.5)}

/* Typography */
.big-emoji{font-size:clamp(44px,12vw,64px);margin-bottom:12px;line-height:1}
.title{font-size:clamp(20px,6vw,28px);font-weight:900;color:#ffd700;margin-bottom:8px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{text-shadow:0 0 20px rgba(255,215,0,.5)}50%{text-shadow:0 0 40px rgba(255,215,0,.9)}}
.subtitle{font-size:clamp(13px,3.5vw,16px);color:rgba(255,255,255,.7);margin-bottom:20px}
.counter-badge{display:inline-block;background:rgba(255,215,0,.2);border:2px solid #ffd700;border-radius:50px;padding:6px 18px;color:#ffd700;font-size:clamp(12px,3vw,14px);font-weight:700;margin-bottom:18px}

/* Buttons */
.btn-container{display:flex;gap:14px;justify-content:center;margin-top:20px;flex-wrap:wrap;position:relative;min-height:55px}
.btn{padding:clamp(10px,3vw,14px) clamp(22px,6vw,40px);font-family:'Tajawal',sans-serif;font-size:clamp(15px,4vw,18px);font-weight:700;border:none;border-radius:50px;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;position:relative;touch-action:manipulation}
#yes-btn{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;box-shadow:0 4px 20px rgba(245,87,108,.5)}
#yes-btn.fizzy{animation:fizzy .4s}
@keyframes fizzy{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.15) rotate(-4deg)}75%{transform:scale(1.15) rotate(4deg)}}
#no-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 4px 20px rgba(118,75,162,.5)}
#progress-msg{margin-top:12px;font-size:clamp(13px,3.5vw,15px);color:rgba(255,255,255,.6);min-height:22px}

/* Popup */
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.popup{background:linear-gradient(135deg,#1a1a2e,#16213e);border:2px solid rgba(255,215,0,.5);border-radius:20px;padding:clamp(20px,5vw,30px);max-width:380px;width:100%;text-align:center;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.3) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.popup-emoji{font-size:clamp(44px,12vw,60px);margin-bottom:12px;display:block;animation:bounce .6s infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.popup-msg{font-size:clamp(16px,4.5vw,20px);font-weight:700;color:#ffd700;margin-bottom:18px;line-height:1.6}
.popup-close{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;border:none;padding:clamp(10px,3vw,12px) clamp(24px,7vw,35px);border-radius:50px;font-family:'Tajawal',sans-serif;font-size:clamp(14px,4vw,16px);font-weight:700;cursor:pointer;box-shadow:0 4px 15px rgba(245,87,108,.4);touch-action:manipulation}

/* Puzzle */
#puzzle-section{display:none}
.puzzle-title{font-size:clamp(18px,5vw,22px);font-weight:900;color:#ffd700;margin-bottom:12px}
.puzzle-desc{color:rgba(255,255,255,.8);font-size:clamp(13px,3.5vw,15px);margin-bottom:8px}
.puzzle-area{display:flex;gap:clamp(12px,4vw,24px);justify-content:center;align-items:center;margin:20px 0;flex-wrap:nowrap}

/* Drag source */
.drag-zone{width:clamp(150px,28vw,150px);height:clamp(150px,28vw,150px);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(11px,3vw,13px);font-weight:700;border:3px dashed #f093fb;background:rgba(240,147,251,.15);color:#f093fb;gap:6px;cursor:grab;user-select:none;-webkit-user-select:none;transition:transform .2s,opacity .2s;flex-shrink:0}
.drag-zone img{width:clamp(65px,18vw,85px);height:clamp(65px,18vw,85px);border-radius:10px;object-fit:cover;pointer-events:none;border:2px solid #f093fb;display:block}
.drag-zone.dragging{opacity:.45;transform:scale(.93)}

/* Drop target */
.drop-zone{width:clamp(150px,28vw,150px);height:clamp(150px,28vw,150px);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(11px,3vw,13px);font-weight:700;border:3px dashed #667eea;background:rgba(102,126,234,.15);color:#667eea;gap:6px;transition:all .25s;flex-shrink:0}
.drop-zone img{width:clamp(65px,18vw,85px);height:clamp(65px,18vw,85px);border-radius:10px;object-fit:cover;pointer-events:none;display:block}
.drop-zone.over{background:rgba(245,87,108,.25);border-color:#f5576c;transform:scale(1.08);color:#f5576c}
.drop-zone.done{background:rgba(46,213,115,.2);border-color:#2ed573;animation:successPulse .5s}
@keyframes successPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* Ghost image while dragging (touch) */
#drag-ghost{position:fixed;pointer-events:none;z-index:9999;opacity:.85;border-radius:12px;transform:translate(-50%,-50%);transition:none;display:none}

.arrow-hint{color:rgba(255,255,255,.45);font-size:clamp(22px,6vw,30px);animation:arrowBounce .7s infinite alternate;flex-shrink:0}
@keyframes arrowBounce{from{transform:translateX(0)}to{transform:translateX(7px)}}
#puzzle-hint{color:rgba(255,255,255,.5);font-size:clamp(11px,3vw,13px);margin-top:8px}

/* Results */
#result-section{display:none}
.celebration-text{font-size:clamp(20px,6vw,26px);font-weight:900;color:#ffd700;margin:8px 0 14px;animation:pulse 1s infinite}
.result-img{width:clamp(110px,30vw,150px);height:clamp(110px,30vw,150px);border-radius:50%;object-fit:cover;border:5px solid #ffd700;margin:0 auto 14px;display:block;animation:imgReveal 1s cubic-bezier(.34,1.56,.64,1)}
@keyframes imgReveal{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.result-card{background:rgba(255,255,255,.08);border:2px solid rgba(255,215,0,.3);border-radius:20px;padding:clamp(16px,4vw,25px);margin-top:14px;overflow-x:auto}
.result-card-title{color:#ffd700;font-size:clamp(15px,4vw,18px);font-weight:700;margin-bottom:10px}
.status-badge-res{display:inline-block;background:rgba(46,213,115,.2);border:2px solid #2ed573;border-radius:50px;padding:5px 18px;color:#2ed573;font-weight:700;font-size:clamp(13px,3.5vw,15px);margin-bottom:14px}
.result-table{width:100%;border-collapse:collapse;color:#fff;min-width:260px}
.result-table th{background:rgba(255,215,0,.22);padding:clamp(7px,2vw,10px) clamp(5px,2vw,8px);font-size:clamp(12px,3vw,14px);color:#ffd700}
.result-table td{padding:clamp(7px,2vw,9px) clamp(5px,2vw,8px);border-bottom:1px solid rgba(255,255,255,.1);font-size:clamp(12px,3vw,14px)}
.total-row-res{background:rgba(255,215,0,.15);font-weight:700;color:#ffd700}
.progress-wrap{background:rgba(255,255,255,.1);border-radius:10px;height:7px;overflow:hidden;margin-top:4px;min-width:50px}
.progress-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#f093fb,#f5576c);transition:width 1.5s ease;width:0}
.progress-fill-gold{background:linear-gradient(90deg,#ffd700,#f5576c)}

/* Confetti */
.confetti-piece{position:fixed;pointer-events:none;z-index:9999;animation:confettiFall 3s ease-in forwards}
@keyframes confettiFall{0%{opacity:1;top:-20px}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- Ghost element that follows finger while dragging on touch -->
<img id="drag-ghost" src="ahmed.jpg" width="80" height="80"
  onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><circle cx=%2240%22 cy=%2240%22 r=%2240%22 fill=%22%23f093fb%22/><text x=%2240%22 y=%2252%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2236%22>😎</text></svg>'"/>

<div id="main-card">

  <!-- SECTION 1 -->
  <div id="intro-section">
    <div class="big-emoji">🎓</div>
    <div class="title">نتيجة أحمد وصلت!</div>
    <div class="subtitle">البشمهندس محمود بعتها للكل الا انت 😅</div>
    <div class="counter-badge" id="counter-badge">عدد المحاولات: 0 / 5</div>
    <div class="btn-container">
      <button class="btn" id="yes-btn" onclick="pressYes()">ايوه عايز أشوف 👀</button>
      <button class="btn" id="no-btn" onclick="pressNo()">لأ مش عارف 😇</button>
    </div>
    <div id="progress-msg"></div>
  </div>

  <!-- SECTION 2: Puzzle -->
  <div id="puzzle-section">
    <div class="puzzle-title">🧩 حل اللغز الأول!</div>
    <div class="puzzle-desc">اسحب صورة أحمد وحطها في الإطار عشان تشوف النتيجة</div>
    <div class="puzzle-area">
      <div class="drag-zone" id="drag-source">
        <img id="drag-ahmed" src="ahmed.jpg" alt="أحمد"
          onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect fill=%22%23f093fb%22 rx=%2212%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2265%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2240%22>😎</text></svg>'"/>
        <div>اسحبني! 👆</div>
      </div>
      <div class="arrow-hint">←</div>
      <div class="drop-zone" id="drop-target">
        <img id="frame-img" src="images.jfif" alt="الإطار"
          onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect fill=%22%23667eea%22 rx=%2212%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2265%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2240%22>🖼️</text></svg>'"/>
        <div id="drop-label">حطني هنا!</div>
      </div>
    </div>
    <div id="puzzle-hint">أحمد خايف يشوف نتيجته بنفسه 😂</div>
  </div>

  <!-- SECTION 3: Results -->
  <div id="result-section">
    <div class="celebration-text">🎉 مبروك يا أحمد! 🎉</div>
    <img src="ahmed.jpg" class="result-img" alt="أحمد"
      onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22150%22><circle cx=%2275%22 cy=%2275%22 r=%2275%22 fill=%22%23f093fb%22/><text x=%2275%22 y=%2290%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2260%22>😎</text></svg>'"/>
    <div class="result-card">
      <div class="result-card-title">النتيجة الكلية - الصف الأول الإعدادي</div>
      <div class="status-badge-res">حالة الطالب: ناجح ✨</div>
      <table class="result-table">
        <thead><tr><th>المادة</th><th>الدرجة</th><th>من</th><th>النسبة</th></tr></thead>
        <tbody id="res-body"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
/* ========== DATA ========== */
const gradesData=[
  {name:"العلوم",score:29,max:40,pct:72.5},
  {name:"الدراسات الاجتماعية",score:30,max:40,pct:75},
  {name:"English",score:44,max:60,pct:73},
  {name:"رياضيات",score:34,max:60,pct:57},
  {name:"اللغة العربية",score:66,max:80,pct:82.5}
];
const totalScore=gradesData.reduce((a,b)=>a+b.score,0);
const totalMax=gradesData.reduce((a,b)=>a+b.max,0);
const totalPct=((totalScore/totalMax)*100).toFixed(1);

/* ========== MESSAGES ========== */
const FIRST_MSG="استر يا دولي دة اعراض ناس 😤";
const LAST_MSG="يعم خلاص أوريك... دة انت مصمم بقا 😤✅";
const rndMsgs=[
  "يعني الدولي مش عايز يستر 🤔",
  "يعم اعمل معروف مينفعش والله 😂",
  "متضعطش عليا وتجري للرزيلة وأنا بحبها بصراحة 💔",
  "تدفع كام وأنا أوريك؟ هتدفع هتشوف اللي عمرك ما شوفته... أما ابو بلاش دة معرفهوش 💸"
];
const pressHints={1:"يا دولي!",2:"هو دة بتعمل إيه؟",3:"شايل إيه على قلبك؟",4:"يسطا بقا!",5:"أوكيه... أوكيه..."};

/* ========== STATE ========== */
let pressCount=0,transX=0,transY=0,popupCb=null;

/* ========== STARS ========== */
(function(){
  const s=document.getElementById('stars');
  for(let i=0;i<60;i++){
    const d=document.createElement('div');
    d.className='star';
    const sz=Math.random()*3+1;
    d.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${1.5+Math.random()*2}s`;
    s.appendChild(d);
  }
})();

/* ========== AUDIO ========== */
let actx=null;
function initAudio(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();}
function playSound(type){
  try{
    initAudio();
    const o=actx.createOscillator(),g=actx.createGain();
    o.connect(g);g.connect(actx.destination);
    if(type==='run'){
      o.frequency.setValueAtTime(800,actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(200,actx.currentTime+.3);
      g.gain.setValueAtTime(.3,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.01,actx.currentTime+.3);
    }else if(type==='win'){
      [523,659,784,1047].forEach((f,i)=>o.frequency.setValueAtTime(f,actx.currentTime+i*.12));
      g.gain.setValueAtTime(.3,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.01,actx.currentTime+.6);
    }else{
      o.frequency.setValueAtTime(440,actx.currentTime);
      g.gain.setValueAtTime(.2,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.01,actx.currentTime+.2);
    }
    o.start();o.stop(actx.currentTime+.7);
  }catch(e){}
}

/* ========== YES / NO ========== */
function pressYes(){
  pressCount++;
  playSound('run');
  const btn=document.getElementById('yes-btn');
  document.getElementById('counter-badge').textContent=`عدد المحاولات: ${pressCount} / 5`;
  document.getElementById('progress-msg').textContent=pressHints[pressCount]||'';
  btn.classList.add('fizzy');
  setTimeout(()=>btn.classList.remove('fizzy'),450);

  if(pressCount<=5){
    const card=document.getElementById('main-card');
    const cR=card.getBoundingClientRect();
    const bR=btn.getBoundingClientRect();
    const m=14;
    let dx=(Math.random()-.5)*260,dy=(Math.random()-.5)*160;
    if(bR.left+dx<cR.left+m) dx=Math.abs(dx);
    if(bR.right+dx>cR.right-m) dx=-Math.abs(dx);
    if(bR.top+dy<cR.top+m) dy=Math.abs(dy);
    if(bR.bottom+dy>cR.bottom-m) dy=-Math.abs(dy);
    transX+=dx;transY+=dy;
    btn.style.transform=`translate(${transX}px,${transY}px)`;
  }

  if(pressCount===1){
    showPopup(FIRST_MSG,'😤');
  }else if(pressCount<5){
    showPopup(rndMsgs[Math.floor(Math.random()*rndMsgs.length)],'😂');
  }else if(pressCount===5){
    showPopup(rndMsgs[Math.floor(Math.random()*rndMsgs.length)],'😂');
    setTimeout(()=>{
      btn.style.transform='none';transX=0;transY=0;
      setTimeout(()=>showPopup(LAST_MSG,'😤✅',true),600);
    },900);
  }
}

function pressNo(){
  playSound('beep');
  showPopup('احسن بردو... معنداش درجات تنكشف على رجالة 😏','🙈');
}

/* ========== POPUP ========== */
function showPopup(msg,emoji,triggerPuzzle){
  document.querySelector('.popup-overlay')?.remove();
  const ov=document.createElement('div');
  ov.className='popup-overlay';
  ov.innerHTML=`<div class="popup"><span class="popup-emoji">${emoji||'😄'}</span><div class="popup-msg">${msg}</div><button class="popup-close">تمام يعم 👍</button></div>`;
  document.body.appendChild(ov);
  ov.querySelector('.popup-close').addEventListener('click',()=>{
    ov.remove();
    if(triggerPuzzle)showPuzzle();
  });
}

/* ========== SHOW PUZZLE ========== */
function showPuzzle(){
  document.getElementById('intro-section').style.display='none';
  document.getElementById('puzzle-section').style.display='block';
  initDragDrop();
}

/* ========== DRAG & DROP — Pointer Events (works on all devices) ========== */
function initDragDrop(){
  const src=document.getElementById('drag-source');
  const img=document.getElementById('drag-ahmed');
  const target=document.getElementById('drop-target');
  const ghost=document.getElementById('drag-ghost');
  let dragging=false;

  /* Also keep native HTML5 drag for desktop */
  img.draggable=true;
  img.addEventListener('dragstart',e=>{
    e.dataTransfer.setData('text','ahmed');
    src.classList.add('dragging');
    playSound('run');
  });
  img.addEventListener('dragend',()=>src.classList.remove('dragging'));
  target.addEventListener('dragover',e=>{e.preventDefault();target.classList.add('over');});
  target.addEventListener('dragleave',()=>target.classList.remove('over'));
  target.addEventListener('drop',e=>{e.preventDefault();target.classList.remove('over');dropSuccess();});

  /* Pointer Events — reliable on mobile & desktop */
  src.addEventListener('pointerdown',e=>{
    if(e.button&&e.button!==0)return; // left click / touch only
    dragging=true;
    src.setPointerCapture(e.pointerId);
    src.classList.add('dragging');
    playSound('run');
    // show ghost
    ghost.style.display='block';
    ghost.style.left=e.clientX+'px';
    ghost.style.top=e.clientY+'px';
  });

  src.addEventListener('pointermove',e=>{
    if(!dragging)return;
    ghost.style.left=e.clientX+'px';
    ghost.style.top=e.clientY+'px';
    // detect hover over drop zone
    ghost.style.display='none';
    const el=document.elementFromPoint(e.clientX,e.clientY);
    ghost.style.display='block';
    const over=el&&(el===target||target.contains(el));
    target.classList.toggle('over',!!over);
  });

  src.addEventListener('pointerup',e=>{
    if(!dragging)return;
    dragging=false;
    src.classList.remove('dragging');
    ghost.style.display='none';
    target.classList.remove('over');
    // check if released over target
    ghost.style.display='none';
    const el=document.elementFromPoint(e.clientX,e.clientY);
    if(el&&(el===target||target.contains(el))){
      dropSuccess();
    }
  });

  src.addEventListener('pointercancel',()=>{
    dragging=false;
    src.classList.remove('dragging');
    ghost.style.display='none';
    target.classList.remove('over');
  });
}

function dropSuccess(){
  const target=document.getElementById('drop-target');
  if(target.classList.contains('done'))return; // prevent double trigger
  target.classList.add('done');
  playSound('win');
  target.innerHTML=`
    <img src="ahmed.jpg" style="width:clamp(65px,18vw,85px);height:clamp(65px,18vw,85px);border-radius:12px;object-fit:cover;border:3px solid #2ed573;display:block"
      onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%232ed573%22/><text x=%2250%22 y=%2265%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2240%22>😎</text></svg>'"/>
    <div style="color:#2ed573;font-size:13px;font-weight:700;margin-top:6px">برافو! 🎉</div>`;
  document.getElementById('puzzle-hint').textContent='جاهز تشوف النتيجة؟ 🎊';
  setTimeout(()=>showResults(),1300);
}

/* ========== RESULTS ========== */
function showResults(){
  document.getElementById('puzzle-section').style.display='none';
  document.getElementById('result-section').style.display='block';
  launchConfetti();playSound('win');
  const tbody=document.getElementById('res-body');
  gradesData.forEach(item=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td style="text-align:right">${item.name}</td><td>${item.score}</td><td>${item.max}</td><td><span style="color:#ffd700">${item.pct}%</span><div class="progress-wrap"><div class="progress-fill" data-w="${item.pct}%"></div></div></td>`;
    tbody.appendChild(tr);
  });
  const tot=document.createElement('tr');
  tot.className='total-row-res';
  tot.innerHTML=`<td>المجموع الكلي</td><td>${totalScore}</td><td>${totalMax}</td><td><span>${totalPct}%</span><div class="progress-wrap"><div class="progress-fill progress-fill-gold" data-w="${totalPct}%"></div></div></td>`;
  tbody.appendChild(tot);
  setTimeout(()=>document.querySelectorAll('.progress-fill').forEach(b=>b.style.width=b.dataset.w),350);
  setTimeout(()=>{launchConfetti();playSound('win');},2200);
}

/* ========== CONFETTI ========== */
function launchConfetti(){
  const colors=['#f093fb','#f5576c','#ffd700','#667eea','#2ed573','#ff6b6b','#48dbfb','#fff'];
  for(let i=0;i<70;i++){
    const c=document.createElement('div');
    c.className='confetti-piece';
    const sz=5+Math.random()*10;
    c.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${sz}px;height:${sz}px;border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.6}s`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}
</script>
